<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="0.55" stop-color="#9141ac"/>
      <stop offset="1" stop-color="#f6a825"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
  </defs>
  <!-- back sheet, hinting at multiple pages -->
  <rect x="24" y="14" width="74" height="96" rx="8" fill="#c7ccd4"/>
  <rect x="18" y="20" width="74" height="96" rx="8" fill="url(#sheet)" stroke="#aeb4bd" stroke-width="1.5"/>
  <!-- the image on the page -->
  <rect x="28" y="32" width="54" height="42" rx="4" fill="url(#photo)"/>
  <circle cx="42" cy="45" r="5.5" fill="#ffffff" opacity="0.85"/>
  <path d="M28 66 L44 52 L56 63 L66 55 L82 70 L82 70 L82 74 L28 74 Z" fill="#1b2430" opacity="0.32"/>
  <!-- text lines -->
  <rect x="28" y="84" width="54" height="5" rx="2.5" fill="#9aa2ad"/>
  <rect x="28" y="95" width="38" height="5" rx="2.5" fill="#b6bcc5"/>
  <!-- magnifier -->
  <circle cx="88" cy="84" r="22" fill="#ffffff" fill-opacity="0.92" stroke="#2b3440" stroke-width="6"/>
  <circle cx="88" cy="84" r="22" fill="#3584e4" fill-opacity="0.16"/>
  <path d="M104 100 L117 113" stroke="#2b3440" stroke-width="9" stroke-linecap="round"/>
</svg>
